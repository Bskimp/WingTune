[package]
name = "wingtune-parser"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Layer 1 ingest: WASM-bound wrapper around blackbox-log for WingTune"

[lib]
# `cdylib` for wasm-pack to produce a loadable WASM module; `rlib` so
# `validate-parser` and other native callers can still use this crate
# as a normal Rust library.
crate-type = ["cdylib", "rlib"]

[dependencies]
blackbox-log = "0.4"
wasm-bindgen = "0.2"
# js_sys: needed for `Option<js_sys::Function>` parameter on scan_log
# so the JS side can pass a progress callback into Rust.
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"

[dev-dependencies]
serde_json = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
